[workspace]
members = [
    "common",
    "collector",
    "datastore",
    "feature_builder",
    "backtester",
    "fixtures",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["QuantBR Authors <dev@example.com>"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
url = "2.5"
flate2 = { version = "1.0", default-features = true, features = ["rust_backend"] }
rand = "0.8"
polars = { version = "0.43.1", features = ["lazy", "parquet", "dtype-date", "dtype-datetime"] }
csv = "1.3"
futures-util = "0.3"
