name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy (non-blocking)
        run: cargo clippy --all-targets -- -D warnings || true

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate fixtures
        run: cargo run -p fixtures -- -s BTCUSDT -d data/raw -D 2025-01-01 -n 5000
      - name: Build features
        run: cargo run -p feature_builder -- -s BTCUSDT --input data/raw --output data/features --from 2025-01-01 --to 2025-01-01
      - name: Backtest
        run: cargo run -p backtester -- -s BTCUSDT --features data/features --from 2025-01-01 --to 2025-01-01 --report reports/test.csv
      - name: Check report exists
        run: test -f reports/test.csv
